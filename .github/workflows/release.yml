name: Build and publish release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js for the build script
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches package version
        run: |
          version="$(node -p "require('./release/manifest.json').version")"
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Build application and skill archives
        run: bash scripts/build-release.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/maybee-package-${GITHUB_REF_NAME#v}.zip" \
            "dist/maybee-${GITHUB_REF_NAME#v}.zip" \
            dist/maybee-package.zip \
            dist/maybee.zip \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "Maybee ${GITHUB_REF_NAME#v}"
